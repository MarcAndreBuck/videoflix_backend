<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your email</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #333333;
    "
  >
    <div
      style="
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 45px 40px 60px;
        box-sizing: border-box;
      "
    >
      <img
        src="cid:videoflix_logo"
        alt="Videoflix"
        width="270"
        style="
          display: block;
          width: 270px;
          max-width: 100%;
          margin: 0 auto 30px;
        "
      />

      <p
        style="
          margin: 0;
          color: #333333;
          font-size: 18px;
          line-height: 1.4;
        "
      >
        Dear
        <span style="color: #2e3edf;">
          {{ username }}
        </span>,<br />
        Thank you for registering with
        <span style="color: #2e3edf;">Videoflix</span>.
        To complete your registration and verify your email address, please click the link below:
      </p>

      <a
        href="{{ activation_link }}"
        style="
          display: inline-block;
          margin: 28px 0 30px;
          padding: 14px 26px;
          background-color: #2e3edf;
          color: #ffffff;
          text-decoration: none;
          font-size: 18px;
          font-weight: 700;
          line-height: 1.2;
          border-radius: 30px;
        "
      >
        Activate account
      </a>

      <p
        style="
          margin: 0 0 26px;
          color: #333333;
          font-size: 18px;
          line-height: 1.4;
        "
      >
        If you did not create an account with us, please disregard this email.
      </p>

      <p
        style="
          margin: 0 0 26px;
          color: #333333;
          font-size: 18px;
          line-height: 1.4;
        "
      >
        Best regards,
      </p>

      <p
        style="
          margin: 0;
          color: #333333;
          font-size: 18px;
          line-height: 1.4;
        "
      >
        Your Videoflix Team.
      </p>
    </div>
  </body>
</html>
